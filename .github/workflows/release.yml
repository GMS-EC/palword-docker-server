name: Release & Docker Build

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Auto Release & Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_name: ${{ steps.get_version.outputs.tag_name }}
      tag_created: ${{ steps.check_release.outputs.tag_created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version and release notes from CHANGELOG.md
        id: get_version
        run: |
          python3 -c "
          import os, re
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # Match ## [1.0.0] or ## [v1.0.0]
          m = re.search(r'^##\s*\[v?([0-9]+\.[0-9]+\.[0-9]+[^\]]*)\]', content, re.MULTILINE)
          ver = m.group(1).strip() if m else '1.0.0'
          tag = f'v{ver}'
          
          # Extract body of the top-most release
          pattern = rf'^##\s*\[v?{re.escape(ver)}\][^\n]*\n(.*?)(?=\n##\s*\[|\Z)'
          notes_match = re.search(pattern, content, re.MULTILINE | re.DOTALL)
          notes = notes_match.group(1).strip() if notes_match else f'Release {tag}'
          
          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as rf:
              rf.write(notes)
          
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as gh:
              gh.write(f'version={ver}\n')
              gh.write(f'tag_name={tag}\n')
          "

      - name: Check if release should be created
        id: check_release
        run: |
          TAG="${{ steps.get_version.outputs.tag_name }}"
          # Only create tag and publish release if workflow_dispatch or commit message has [release]
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || echo "${{ github.event.head_commit.message }}" | grep -qi "\[release\]"; then
            echo "Release publish requested."
            echo "should_release=true" >> $GITHUB_OUTPUT
            if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
              echo "Tag $TAG exists on remote."
              echo "tag_created=false" >> $GITHUB_OUTPUT
            else
              echo "Tag $TAG is new."
              echo "tag_created=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "Regular push to branch. Skipping release/tag creation until tested."
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "tag_created=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update Git tag and GitHub Release
        if: steps.check_release.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_version.outputs.tag_name }}"
          VER="${{ steps.get_version.outputs.version }}"
          
          if [ "${{ steps.check_release.outputs.tag_created }}" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
            
            # Limpiar release previo si existiera en GitHub para evitar conflictos
            gh release delete "$TAG" --yes 2>/dev/null || true
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            # Publicar y actualizar el release asegurando que salga de borrador (Draft) a Publicado (Latest)
            gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md --draft=false --latest || \
            gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md --latest
          fi

  docker:
    name: Build & Push Docker Image
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/palword-docker-server
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.tag_created == 'true' }}
            type=raw,value=${{ needs.release.outputs.tag_name }},enable=${{ needs.release.outputs.tag_created == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
